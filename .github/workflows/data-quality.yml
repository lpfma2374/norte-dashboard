# =============================================================================
# Data Quality noturna contra a API de produção (read-only) — pipeline v2.
# Falha -> abre/atualiza issue com a etiqueta "data-quality".
# =============================================================================
name: Data Quality (produção)

on:
  # Validação noturna da produção (offset próprio por repo, UTC).
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:

# Permissões explícitas: sem isto, o GITHUB_TOKEN pode vir read-only e a
# abertura de issue falha com "Resource not accessible by integration".
permissions:
  contents: read
  issues: write

jobs:
  data-quality:
    name: Expectativas declarativas (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correr expectativas de qualidade dos dados
        env:
          DATA_QUALITY_URL: ${{ vars.DATA_QUALITY_URL || 'https://norte-dashboard.vercel.app/api/dashboard' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          REQUIRE_BYPASS: 'true'
          DATA_QUALITY_RECORDS_PATH: ${{ vars.DATA_QUALITY_RECORDS_PATH || 'companies' }}
        run: |
          if [ "$REQUIRE_BYPASS" = "true" ] && [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::secret VERCEL_AUTOMATION_BYPASS_SECRET em falta (API protegida pelo Vercel) — job saltado"
            exit 0
          fi
          node scripts/data-quality.mjs
      - name: Abrir/atualizar issue se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "data-quality",
            });
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body =
              `A validação noturna de qualidade dos dados falhou.\n\n` +
              `Corrida: ${runUrl}\n\n` +
              `Regras: \`data-quality/expectations.json\`. Vê o log da corrida para as regras violadas ` +
              `e corre manualmente (workflow_dispatch) depois de corrigir.`;
            if (issues.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "🚨 Data Quality: validação dos dados falhou",
                body,
                labels: ["data-quality"],
              });
            }
